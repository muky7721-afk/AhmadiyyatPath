<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEE8FA">
<title>Tarbiyyat Path</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%237C5CE6%22 d=%22M12 1l3.2 4.9 5.6-.8-.8 5.6L23 12l-3 1.3.8 5.6-5.6-.8L12 23l-3.2-4.9-5.6.8.8-5.6L1 12l3-1.3-.8-5.6 5.6.8z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one soft column on a lilac ground; home = progress ring + a winding path of module stones; lesson = one focused card at a time. */
:root{
  --bg:#EEE8FA; --bg2:#E3D9F8; --card:#FFFFFF; --card2:#F8F4FF; --ink:#2B2140; --muted:#6E6488; --line:#E2D8F5;
  --violet:#7C5CE6; --on-violet:#FFFFFF; --violet-soft:#E9E1FD;
  --pink:#E0628F; --pink-soft:#FCE2EC; --mint:#26A37D; --mint-soft:#D7F2E8; --peach:#E5874A; --peach-soft:#FDE6D5; --gold:#E3A72A;
  --shadow:0 10px 30px -12px rgba(91,60,170,.28); --shadow-s:0 4px 14px -6px rgba(91,60,170,.22);
  --blob1:#D7C7FF; --blob2:#FFD3E6; --blob3:#CFF3E6;
  --f-head:"Fraunces",Georgia,serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --f-ar:"Amiri","Traditional Arabic",serif;
  --r-l:28px; --r-m:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1328; --bg2:#231A37; --card:#2A2142; --card2:#31274D; --ink:#F1ECFF; --muted:#B5AAD2; --line:#3D3160;
  --violet:#AB90FF; --on-violet:#1A1328; --violet-soft:#3A2D63;
  --pink:#FF8FB8; --pink-soft:#4B2640; --mint:#5FD8B0; --mint-soft:#1D4038; --peach:#FFB17C; --peach-soft:#4A3022; --gold:#F5C55A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); --shadow-s:0 4px 14px -6px rgba(0,0,0,.5);
  --blob1:#3B2A6E; --blob2:#4D2246; --blob3:#1D4A40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1328; --bg2:#231A37; --card:#2A2142; --card2:#31274D; --ink:#F1ECFF; --muted:#B5AAD2; --line:#3D3160;
  --violet:#AB90FF; --on-violet:#1A1328; --violet-soft:#3A2D63;
  --pink:#FF8FB8; --pink-soft:#4B2640; --mint:#5FD8B0; --mint-soft:#1D4038; --peach:#FFB17C; --peach-soft:#4A3022; --gold:#F5C55A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); --shadow-s:0 4px 14px -6px rgba(0,0,0,.5);
  --blob1:#3B2A6E; --blob2:#4D2246; --blob3:#1D4A40; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3{font-family:var(--f-head);font-variation-settings:"SOFT" 100;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--violet);font-weight:700}
sup{font-size:.6em;line-height:0;opacity:.8}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:12px}

/* decorative background */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.blob.a{width:420px;height:420px;background:var(--blob1);top:-120px;left:-120px}
.blob.b{width:360px;height:360px;background:var(--blob2);top:30%;right:-140px;animation-duration:26s}
.blob.c{width:380px;height:380px;background:var(--blob3);bottom:-160px;left:20%;animation-duration:30s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.1)}}
.star{position:absolute;color:var(--violet);opacity:.18;animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.38;transform:rotate(22deg) scale(1.1)}}

/* hero */
.hero{padding-block:34px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.bism{font-family:var(--f-ar);font-size:1.5rem;color:var(--violet);direction:rtl}
.hero h1{font-size:clamp(2.4rem,8vw,3.4rem);line-height:1.05}
.hero p{color:var(--muted);max-width:44ch}

/* generic cards */
.card{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px}
.soft{background:var(--card2);border-radius:var(--r-m);padding:16px 18px}
.label{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:1.02rem;background:var(--violet);color:var(--on-violet);box-shadow:var(--shadow-s);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.big{width:100%;padding:18px 26px;font-size:1.1rem}
.btn.ghost{background:var(--violet-soft);color:var(--violet);box-shadow:none}
.btn.pink{background:var(--pink);color:#fff}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.link{all:unset;cursor:pointer;color:var(--violet);font-weight:800;display:inline-flex;gap:6px;align-items:center}
.link:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:8px}

/* progress */
.bar{height:12px;border-radius:99px;background:var(--violet-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:8px}
.home-top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .track{stroke:var(--violet-soft)}
.ring .fill{stroke:url(#grad);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .num b{font-family:var(--f-head);font-size:2.1rem;font-weight:600}
.ring .num span{display:block;font-size:.72rem;color:var(--muted);font-weight:700;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:800;background:var(--violet-soft);color:var(--violet)}
.chip.pink{background:var(--pink-soft);color:var(--pink)} .chip.mint{background:var(--mint-soft);color:var(--mint)} .chip.peach{background:var(--peach-soft);color:var(--peach)}
@media (max-width:520px){.home-top{grid-template-columns:1fr;justify-items:center;text-align:center}.home-top .chips{justify-content:center}}

/* journey path */
.path{display:grid;gap:0;position:relative}
.stone{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center;padding:14px 0;position:relative}
.stone:focus-visible{outline:3px solid var(--violet);outline-offset:4px;border-radius:24px}
.stone:not(:last-child)::after{content:"";position:absolute;left:31px;top:76px;bottom:-14px;border-left:3px dotted var(--line)}
.pebble{width:64px;height:64px;display:grid;place-items:center;font-family:var(--f-head);font-size:1.5rem;font-weight:600;color:#fff;
  border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;box-shadow:var(--shadow-s);transition:transform .3s,border-radius .6s;position:relative;z-index:1}
.stone:hover .pebble{transform:rotate(-6deg) scale(1.06);border-radius:58% 42% 37% 63% / 56% 59% 41% 44%}
.h-violet .pebble{background:var(--violet)} .h-pink .pebble{background:var(--pink)} .h-mint .pebble{background:var(--mint)} .h-peach .pebble{background:var(--peach)}
.pebble.done{background:var(--gold)!important}
.stone-body{background:var(--card);border-radius:var(--r-m);padding:14px 18px;box-shadow:var(--shadow-s);display:grid;gap:6px;min-width:0;transition:transform .25s}
.stone:hover .stone-body{transform:translateX(4px)}
.stone-body h3{font-size:1.18rem}
.stone-body p{font-size:.92rem;color:var(--muted)}
.stone-meta{display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:800;color:var(--muted)}
.stone-meta .bar{flex:1}

/* module header */
.mhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lessons{display:grid;gap:10px}
.lrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;background:var(--card);border-radius:var(--r-m);padding:12px 16px;box-shadow:var(--shadow-s);transition:transform .2s}
.lrow:hover{transform:translateY(-2px)}
.lrow:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--violet-soft);color:var(--violet)}
.lrow.done .dot{background:var(--mint);color:#fff}
.lrow.next{outline:2px dashed var(--violet);outline-offset:2px}
.lrow .t{font-weight:700;line-height:1.3;min-width:0}
.lrow .go{color:var(--muted);font-weight:800}

/* lesson */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lesson-title{font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.12}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.notes li{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start}
.notes li svg{margin-top:4px;color:var(--violet)}
.notes li:nth-child(3n+2) svg{color:var(--pink)} .notes li:nth-child(3n) svg{color:var(--mint)}
.cond{background:linear-gradient(135deg,var(--violet-soft),var(--pink-soft));border-radius:var(--r-m);padding:18px 20px;display:grid;gap:6px}
.cond b{font-family:var(--f-head);font-size:1.15rem;font-weight:600}
.think{display:grid;gap:10px}
.think ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:1rem;color:var(--ink);background:var(--card2);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
textarea:focus{outline:none;border-color:var(--violet)}
.refs{display:flex;gap:8px;flex-wrap:wrap}
.ref{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;background:var(--violet-soft);color:var(--violet);font-weight:800;font-size:.86rem;text-decoration:none}
.ref:hover{filter:brightness(1.04)}
.src{font-size:.84rem;color:var(--muted)}
.yq{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.yq button{border:0;border-radius:16px;padding:10px 0;font-weight:800;background:var(--violet-soft);color:var(--violet);transition:transform .15s,background .2s}
.yq button.on{background:var(--mint);color:#fff;animation:pop .35s}
.yq button:active{transform:scale(.9)}
@keyframes pop{40%{transform:scale(1.18)}}

/* quiz & practice */
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border-radius:18px;padding:14px 18px;background:var(--card2);border:2px solid var(--line);font-weight:700;transition:transform .15s,background .2s,border-color .2s}
.opt:hover{border-color:var(--violet)}
.opt:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.opt.right{background:var(--mint-soft);border-color:var(--mint);animation:pop .35s}
.opt.wrong{background:var(--pink-soft);border-color:var(--pink);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tabs{display:flex;gap:6px;background:var(--card2);border-radius:999px;padding:5px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:999px;padding:9px 18px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--violet);color:var(--on-violet)}
.flip{perspective:1000px;cursor:pointer;min-height:220px}
.flip-in{position:relative;width:100%;min-height:220px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-l);display:grid;place-items:center;text-align:center;padding:24px;box-shadow:var(--shadow)}
.face.front{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.face.front b{font-family:var(--f-head);font-size:2rem;font-weight:600}
.face.back{background:var(--card);transform:rotateY(180deg);font-size:1.15rem;font-weight:700}
.bigscore{font-family:var(--f-head);font-size:3rem;font-weight:600;line-height:1}

/* conditions */
.tenlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tenlist li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--card);border-radius:var(--r-m);padding:14px 16px;box-shadow:var(--shadow-s);transition:background .3s}
.tenlist li.on{background:var(--mint-soft)}
.tenbtn{width:40px;height:40px;border-radius:14px 18px 14px 18px;border:2px solid var(--line);background:var(--card2);font-weight:800;color:var(--violet);transition:all .25s}
.tenlist li.on .tenbtn{background:var(--mint);border-color:var(--mint);color:#fff;border-radius:50%}

/* mentor */
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tbl{overflow-x:auto}

footer{margin-top:40px;font-size:.84rem;color:var(--muted);display:grid;gap:6px;text-align:center}

/* view transitions */
.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.06s}.view>*:nth-child(3){animation-delay:.12s}.view>*:nth-child(4){animation-delay:.18s}.view>*:nth-child(5){animation-delay:.24s}.view>*:nth-child(6){animation-delay:.3s}
@keyframes rise{from{transform:translateY(14px);opacity:.01}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:800;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;border-radius:3px;animation:fall 1.7s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.celebrate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);padding:20px}
.celebrate .card{max-width:420px;text-align:center;display:grid;gap:14px;animation:pop .5s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <svg class="star" style="top:12%;left:8%;width:34px" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1l3.2 4.9 5.6-.8-.8 5.6L23 12l-3 1.3.8 5.6-5.6-.8L12 23l-3.2-4.9-5.6.8.8-5.6L1 12l3-1.3-.8-5.6 5.6.8z"/></svg>
  <svg class="star" style="top:28%;right:9%;width:22px;animation-delay:1.5s" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1l3.2 4.9 5.6-.8-.8 5.6L23 12l-3 1.3.8 5.6-5.6-.8L12 23l-3.2-4.9-5.6.8.8-5.6L1 12l3-1.3-.8-5.6 5.6.8z"/></svg>
  <svg class="star" style="top:62%;left:5%;width:26px;animation-delay:3s" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1l3.2 4.9 5.6-.8-.8 5.6L23 12l-3 1.3.8 5.6-5.6-.8L12 23l-3.2-4.9-5.6.8.8-5.6L1 12l3-1.3-.8-5.6 5.6.8z"/></svg>
  <svg class="star" style="top:80%;right:7%;width:38px;animation-delay:2s" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1l3.2 4.9 5.6-.8-.8 5.6L23 12l-3 1.3.8 5.6-5.6-.8L12 23l-3.2-4.9-5.6.8.8-5.6L1 12l3-1.3-.8-5.6 5.6.8z"/></svg>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CE6"/><stop offset="1" stop-color="#E0628F"/></linearGradient></defs></svg>

<div class="wrap">
  <main id="view" class="view"></main>
  <footer>
    <div>Lessons are written in plain English from the New Ahmadi Tarbiyyat Syllabus and the Jama'at's books on alislam.org.</div>
    <div id="saved">Progress is saved on this device.</div>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= SOURCES ================= */
const SYL="https://ahmadiconverts.ahmadiyya.uk/wp-content/uploads/2023/10/New-Ahmadi-Muslim-Tarbiyyat-Training-Syllabus-2nd-EDITION-2022-REVISED-December-2021.pdf";
const SRC={
  BRE:["Basics of Religious Education","https://new.alislam.org/library/en/books/basics-religious-education"],
  ITA:["Invitation to Ahmadiyyat","https://new.alislam.org/library/en/books/invitation-to-ahmadiyyat"],
  COB:["Conditions of Bai'at & Responsibilities of an Ahmadi","https://new.alislam.org/library/en/books/conditions-baiat-responsibilities-ahmadi"],
  YQ:["Qāʻidah Yassarnal-Qur'ān","https://www.alislam.org/book/qaidah-yassarnal-quran/"],
  SAL:["Salat: The Muslim Prayer Book","https://www.alislam.org/book/salat/"],
  PTP:["Pathway to Paradise","https://www.alislam.org/book/pathway-to-paradise/islamic-beliefs-teachings/"],
  LOM:["Life of Muhammad(sa)","https://www.alislam.org/book/life-of-muhammad/"],
  LOA:["Life of Ahmad(as)","https://www.alislam.org/book/life-of-ahmad/"],
  FG:["Forty Gems of Beauty","https://www.alislam.org/book/forty-gems-beauty/"],
  PRI:["A Primer of Religious Knowledge","https://files.alislam.cloud/pdf/Primer-Religious-Knowledge.pdf"],
  WILL:["The Will (Al-Wasiyyat)","https://new.alislam.org/library/en/books/will"],
  VOI:["The Victory of Islam","https://www.alislam.org/book/victory-of-islam/"],
  JII:["Jesus in India","https://new.alislam.org/library/en/books/jesus-in-india"],
  SYL:["New Ahmadi Tarbiyyat Syllabus",SYL],
  TEN:["The ten conditions, official wording","https://new.alislam.org/library/books/syllabus-waqf-e-nau-part-3-years-15-21?page=30"]
};
const Q=v=>["Holy Qur'an "+v,"https://www.alislam.org/quran/app/"+v];

/* ================= TEN CONDITIONS (plain-English summaries) ================= */
const TEN=[
"Never associate anything or anyone with God, for the rest of your life.",
"Keep away from lying, sexual immorality (including lustful looks), wickedness, cruelty, dishonesty, causing trouble and rebellion. Don't let your desires carry you away, however strong they feel.",
"Pray the five daily prayers. Try hard to also pray Tahajjud (the late-night prayer) and to send blessings (Durud) on the Holy Prophet(sa). Every day, ask forgiveness, remember God's favours and praise Him.",
"Never harm any of God's creatures, by your words, your hands or any other way, even when your emotions are running high.",
"Stay faithful to God in every situation, happy or sad, easy or hard. Accept what He decides, bear hardship in His way, and keep moving forward instead of turning back.",
"Leave behind customs that go against Islam and give up base desires. Make the Holy Qur'an and the sayings of the Holy Prophet(sa) your guide in every part of life.",
"Give up pride and vanity completely. Live with humility, cheerfulness, patience and gentleness.",
"Hold your faith, its honour and the cause of Islam dearer than your life, wealth, honour, children and everyone you love.",
"Spend your life serving God's creation for His sake, and use every ability God gave you to benefit people.",
"Form a bond of brotherhood with the Promised Messiah(as), obeying him in everything good for the sake of Allah, with a devotion deeper than any worldly relationship, until your last day."
];

/* ================= MODULES & LESSONS =================
   L(title, source, notes[], questions[], extra{p:pages, refs:[[label,url]], yq, c, quran})                       */
function L(t,s,n,q,x){return {t,s,n,q:q||[],x:x||{}};}
const MODS=[
{id:"m1",no:1,title:"The Basics of Islam",short:"Basics",blurb:"Beliefs, worship, the Holy Qur'an, the Holy Prophet(sa), the Promised Messiah(as) and Khilafat.",hue:"violet",lessons:[
L("What is Islam?","PTP",[
"The word Islam means peace, and the peace that comes from submitting your will to God's will.",
"A Muslim is simply someone who submits to God and follows His guidance.",
"Religion is guidance God has sent through prophets. The Qur'an teaches that a guide was sent to every people.",
"Earlier teachings were meant for particular nations and times, and over the centuries their texts were altered. That is why religions now differ. The Qur'an completes and protects the message.",
"We were created to know God and worship Him. Worship has two sides: our duties to God (Huquq-Allah) and our duties to people (Huquq-ul-'Ibad)."],
["What is religion?","Why do teachings of various religions differ?","Who are we?","What is Islam?"],{p:"BRE 3–4"}),
L("The Six Articles of Faith","FG",[
"Faith (Iman) rests on six beliefs, which the Holy Prophet(sa) listed himself:",
"1 · Allah, the One God with no partner. 2 · His angels, spiritual beings who carry out His commands. 3 · His books: the Torah, Psalms, Gospel and, last and complete, the Holy Qur'an.",
"4 · His prophets, sent to every nation, believed in without making distinctions. 5 · The Last Day, when every soul is judged by its own deeds. 6 · Divine decree: God's plan, within which people still have free will.",
"These beliefs are the foundation; they connect a person to God and to the unseen."],
["How many articles of faith are there?","Can you name them?","Why do we believe in them?"],{p:"BRE 5–9"}),
L("The Five Pillars","PTP",[
"Islam is built on five pillars. Belief and practice go together.",
"Shahadah: declaring that there is none worthy of worship except Allah, and that Muhammad(sa) is His Messenger.",
"Salat: the five daily prayers. Fasting (Saum): in Ramadan, from dawn to sunset, with exemptions for the sick, travellers, the elderly and others.",
"Zakat: an annual charge of one-fortieth on savings held for a full year, given for the poor and other set purposes.",
"Hajj: pilgrimage to the Ka'bah in Makkah, once in a lifetime for those who are able and can afford it."],
["How many pillars are there?","What is the aim of the pillars?","How is each pillar practised?"],{p:"BRE 10–14"}),
L("Purpose of Life and Good Conduct","PTP",[
"The Qur'an says humans were created to worship God and come to know Him.",
"Serving people is part of worship. Caring for every human being, not only Muslims, is taught throughout Islam.",
"The Holy Prophet(sa) taught that you are not a true believer until you want for your brother what you want for yourself.",
"His own example: when he conquered Makkah, he forgave the people who had persecuted him for years.",
"Anas(ra), who served him for years as a boy, said the Prophet(sa) never spoke harshly to him."],
["What is the true purpose of life?","Should we love every single human being?","Name one example from the life of the Holy Prophet(sa)."],{p:"BRE 15–16"}),
L("What Makes Islam Distinct","PTP",[
"Islam's message is universal: for every people and every age, not one nation.",
"It teaches there is no compulsion in religion (Qur'an 2:257) and that all people are equal; only righteousness raises a person.",
"Its scripture is complete and protected by God.",
"It is a living faith: God still speaks to His servants and answers prayers.",
"The Holy Prophet(sa) foretold that in the Latter Days Islam would be revived by the Messiah and Mahdi."],
["What are the distinctive features of Islam?","Who will revive Islam in the Latter Days?"],{p:"BRE 17–19"}),
L("Ahmadiyyat, the Revival of Islam","PTP",[
"The Ahmadiyya Muslim Community was founded in 1889 by Hazrat Mirza Ghulam Ahmad(as) of Qadian, India.",
"He claimed to be the Promised Messiah and Mahdi whom the Holy Prophet(sa) foretold. Ahmadiyyat is not a new religion; it is Islam.",
"His mission: revive Islam and show the glory of the Holy Prophet(sa), through argument, writing and prayer, never by the sword.",
"Three main points of difference with other Muslims:",
"1 · Jesus(as) did not die on the cross; he died a natural death. 2 · The Messiah and the Mahdi are one person, a follower of the Holy Prophet(sa). 3 · 'Seal of the Prophets' means no new law-bearing prophet can come, but a prophet who follows the Holy Prophet(sa) can."],
["What was the grand mission of the Promised Messiah(as)?","What are the main points of distinction of an Ahmadi Muslim?"],{p:"BRE 20–26",refs:[SRC.VOI]}),
L("Allah and His Attributes","ITA",[
"Allah is One. He has no partner, no son and no equal.",
"He is holy, free of every flaw, and not limited by time or place.",
"He speaks to His chosen servants and answers prayer.",
"Surah Al-Fatiha names four of His great attributes: Lord of all the worlds (Rabb), the Gracious (Rahman), the Merciful (Rahim), and Master of the Day of Judgement.",
"Surah Al-Ikhlas sums it up: God is One, needs no one, has no children and was not born, and nothing is like Him."],
["Which attributes of Allah do you find most comforting?","What does it mean that God still speaks?"],{p:"BRE 30–35",refs:[Q("112:2")]}),
L("The Holy Qur'an","PTP",[
"The Qur'an was revealed to the Holy Prophet(sa) over 23 years. It has 114 chapters (Surahs) and is divided into 30 parts.",
"The first verses revealed were the opening of Surah Al-'Alaq, in the cave of Hira.",
"God promises in the Qur'an that He Himself will guard it (15:10). From the start it was memorised by many companions and written down as it was revealed.",
"Etiquette: be clean, begin with Ta'awwudh (seeking refuge from Satan) and Bismillah, recite slowly, and try to understand the meaning.",
"Hazrat Khalifatul Masih V(aba) advises reading a little every day, along with its translation."],
["What is the Holy Qur'an?","How was it safeguarded?","What etiquette do we follow when reciting it?"],{p:"BRE 35–40",refs:[Q("15:10")]}),
L("Surah Al-Fatiha","PRI",[
"Al-Fatiha, 'The Opening', is the first chapter and is recited in every unit of every prayer.",
"Its meaning in brief: all praise belongs to Allah, Lord of all the worlds, the Gracious, the Merciful, Master of the Day of Judgement.",
"You alone we worship, and You alone we ask for help.",
"Guide us on the straight path: the path of those You have blessed, not of those who earned Your displeasure or went astray.",
"It is called the most complete prayer because it holds praise, worship and a request for guidance, and it summarises the whole Qur'an."],
["Why is Al-Fatiha the most comprehensive prayer?","What significance does it have for you?"],{p:"BRE 50–54",refs:[Q("1:1")]}),
L("What is Hadith?","PTP",[
"A Hadith is a report of something the Holy Prophet(sa) said or did. His practice is called the Sunnah.",
"Order of authority: first the Qur'an, then the Sunnah, then Hadith.",
"A Hadith that clearly contradicts the Qur'an is not accepted.",
"The six best-known collections: Bukhari, Muslim, Tirmidhi, Abu Dawud, Ibn Majah and Nasa'i."],
["What is a Hadith?","Why is Hadith important?","Name the most authentic collections."],{p:"BRE 91–92"}),
L("Forty Ahadith: 1 to 10","FG",[
"1 · Faith is belief in God, His angels, books, prophets, the Last Day and divine decree.",
"2 · Islam rests on five pillars: testimony, prayer, Zakat, Hajj and fasting.",
"3 · The Holy Prophet(sa) was given gifts no earlier prophet had, including a mission to all people.",
"4 · He is the last law-giving prophet. Any later reformer works within his prophethood.",
"5 · Actions are judged by intentions.  6 · Allah looks at hearts and deeds, not looks or wealth.",
"7 · Aim for the highest ranks by serving faith with your time and means.  8 · Change wrong with your hand, your words, or at least your heart.",
"9 · Wish for your brother what you wish for yourself.  10 · Help your brother when he's wronged, and stop him when he's doing wrong."],
["Which of these sayings speaks to you most?"],{p:"BRE 93–100"}),
L("Forty Ahadith: 11 to 20","FG",[
"11 · Obey those in authority in what is right, never in disobeying God.  12 · Speaking the truth to an unjust ruler is a great jihad.",
"13 · Be gentle with the young and respect elders.  14 · The greatest sins: associating partners with God, disobeying parents and lying.",
"15 · Respect and educate children.  16 · Choose a spouse for their piety.",
"17 · The best men are those best to their wives.  18 · A righteous woman fulfils her duties to her husband.",
"19 · Whoever raises an orphan will be close to the Prophet(sa) in Paradise.  20 · Treat neighbours well."],
["Which of these sayings could you practise this week?"],{p:"BRE 100–105"}),
L("Forty Ahadith: 21 to 30","FG",[
"21 · Don't wish for war, but stand firm if it comes.  22 · Keep treaties, and spare women and children.",
"23 · Avoid the seven destructive sins, including unjust killing and usury.  24 · Intoxicants are forbidden, even in small amounts.",
"25 · A person who cheats is not truly one of us.  26 · Don't blindly imitate other nations.",
"27 · When the heart is sound, the whole body is sound.  28 · Leave what troubles your conscience.",
"29 · Don't let feelings of inferiority defeat you.  30 · True repentance washes sin away."],
["Which saying surprised you?"],{p:"BRE 106–112"}),
L("Forty Ahadith: 31 to 40","FG",[
"31 · A believer isn't bitten twice from the same hole; learn from mistakes.  32 · Nothing is better than good character.",
"33 · Honour the respected leaders of other peoples.  34 · Pay workers before their sweat dries.",
"35 · The worst feast is one where only the rich are invited.  36 · The giving hand is better than the receiving hand.",
"37 · Leave your heirs comfortable rather than in need.  38 · Everyone is a shepherd, responsible for those in their care.",
"39 · Seeking knowledge is a duty of every Muslim.  40 · Wisdom is the believer's lost property; take it wherever you find it."],
["Which saying would you share with a friend?"],{p:"BRE 113–119"}),
L("Ahadith review: 1 to 10","FG",[
"This lesson is recall practice. Try to explain each idea in your own words before checking the earlier lesson:",
"Intentions · Allah looks at hearts · the five pillars · the six beliefs · wishing for your brother what you wish for yourself · changing wrong with hand, tongue or heart.",
"Tip: pick one saying and act on it today."],
["Explain one of these sayings to someone else in one sentence."],{p:"BRE 121–124"}),
L("Ahadith review: 11 to 20","FG",[
"Recall practice. In your own words, what did the Holy Prophet(sa) teach about:",
"Obeying authority · speaking truth to power · children and elders · the greatest sins · choosing a spouse · how to treat a wife · orphans · neighbours."],
["Which one is hardest to live by, and why?"],{p:"BRE 124–126"}),
L("Ahadith review: 21 to 30","FG",[
"Recall practice. What do you remember about:",
"War and treaties · the seven destructive sins · intoxicants · cheating · imitation · the heart · a troubled conscience · inferiority · repentance."],
["Which saying would help most in everyday life?"],{p:"BRE 127–130"}),
L("Ahadith review: 31 to 40","FG",[
"Recall practice. What do you remember about:",
"Learning from mistakes · good character · honouring leaders of other peoples · paying workers · fair feasts · giving · heirs · responsibility · knowledge · wisdom."],
["Which saying will you remember the longest?"],{p:"BRE 130–134"}),
L("The Holy Prophet(sa) in Makkah","LOM",[
"Arabia before Islam: most Arabs worshipped idols (about 360 stood around the Ka'bah), and women, slaves and the poor were treated harshly.",
"He was born in Makkah in 570 CE. His father Abdullah died before his birth; his mother Aminah died when he was young. His grandfather Abdul Muttalib, then his uncle Abu Talib, raised him.",
"Known as Al-Amin, 'the Trustworthy', he married Khadijah(ra), a respected widow, at about 25.",
"At about 40, while praying in the cave of Hira, he received the first revelation. Khadijah(ra), Zaid(ra), the young Ali(ra) and Abu Bakr(ra) were the first believers.",
"Years of persecution followed: believers like Bilal(ra) were tortured, some Muslims fled to Abyssinia, and his clan was boycotted for about three years.",
"Soon after, Khadijah(ra) and Abu Talib died. He was stoned at Ta'if. In 622 he migrated (the Hijrah) to Madinah, hiding with Abu Bakr(ra) in the cave of Thaur on the way."],
["What was the family background of the Holy Prophet(sa)?","What do you know about his life in Makkah?"],{p:"BRE 220–225",refs:[SRC.LOM]}),
L("The Holy Prophet(sa) in Madinah","LOM",[
"He built a mosque on land he insisted on paying for, and paired each Makkan Muslim with a Madinan as brothers.",
"The Charter of Madinah made Muslims, Arabs and Jews fellow citizens with shared defence and freedom of religion.",
"Badr (2 AH): about 313 Muslims defeated an army three times larger. Literate prisoners could earn freedom by teaching ten children to read.",
"Uhud (3 AH) and the Trench (5 AH), dug on the advice of Salman the Persian, followed. The Treaty of Hudaibiyah (628) set a ten-year truce, and letters went to rulers like Heraclius and the Negus.",
"In 8 AH he entered Makkah with about 10,000 followers, almost without bloodshed, cleared the idols and forgave his enemies: 'no blame on you today'.",
"His farewell sermon taught that life and property are sacred, women have rights, and all people are equal. Among his wives were Khadijah, Aishah, Safiyyah and Maimunah(ra)."],
["What happened in Madinah?","Name some of the wives of the Holy Prophet(sa)."],{p:"BRE 226–233",refs:[SRC.LOM]}),
L("The Rightly Guided Khilafat","PTP",[
"After the Holy Prophet(sa) passed away, Allah raised successors (Khalifas) to carry on his mission.",
"The four Rightly Guided Khalifas: Hazrat Abu Bakr, Hazrat Umar, Hazrat Uthman and Hazrat Ali(ra).",
"When the Prophet(sa) died, Hazrat Abu Bakr(ra) calmed the people by reciting Qur'an 3:145: Muhammad is a Messenger, and messengers before him have passed away.",
"During this Khilafat the Qur'an, already memorised and written down, was gathered into one volume and copies were spread.",
"Over the centuries Muslims lost the blessing of Khilafat. Ahmadis believe it was restored after the Promised Messiah(as)."],
["Name the four Khulafa.","How was the Holy Qur'an preserved?"],{p:"BRE 234–242",refs:[Q("3:145")]}),
L("The Promised Messiah(as): Early Life","LOA",[
"Hazrat Mirza Ghulam Ahmad(as) was born on Friday 13 February 1835 in Qadian, in the Punjab, India.",
"His family came originally from Samarkand. An ancestor, Mirza Hadi Baig, founded the village that became Qadian.",
"His father, Mirza Ghulam Murtaza, was a physician who treated people for free. His mother, Charagh Bibi, was known for her piety.",
"As a child he loved his father's library and reading the Qur'an in the mosque, and wasn't interested in games."],
["What do you know about the early life of the Promised Messiah(as)?"],{p:"BRE 244–248",refs:[SRC.LOA]}),
L("The Promised Messiah(as): Youth and Devotion","LOA",[
"Tutors taught him the Qur'an, Persian, Arabic grammar and logic; his father taught him medicine.",
"From 1863 he worked at the court in Sialkot, where he also debated Christian missionaries. He resigned and returned to Qadian in 1868.",
"He preferred prayer and solitude to worldly work, and spent long periods in study and worship.",
"In 1868 he received a revelation that God was pleased with him and that kings would seek blessings from him."],
["What stands out to you about his youth?"],{p:"BRE 249–250",refs:[SRC.LOA]}),
L("The Promised Messiah(as): Defender of Islam","ITA",[
"His father died in 1876. At that time he received the revelation 'Is not Allah sufficient for His servant?'",
"Islam was under heavy attack from missionaries and others. His book Barahin-e-Ahmadiyya (1880s) set out arguments for Islam and offered Rs 10,000 to anyone who could answer them. No one did.",
"On 1 December 1888 he announced that God had commanded him to take bai'at (a pledge). On 12 January 1889 he published the ten conditions.",
"The first bai'at took place on 23 March 1889 in Ludhiana. Hazrat Hakim Nooruddin(ra) was the first to pledge."],
["Why did he write Barahin-e-Ahmadiyya?","How did the Community begin?"],{p:"BRE 250–255",refs:[SRC.VOI]}),
L("The Promised Messiah(as): His Claim and Legacy","PTP",[
"In The Victory of Islam (1890–91) he announced that God had appointed him the Promised Messiah and Mahdi.",
"He faced fierce opposition from clerics and others, yet the Community kept growing.",
"He wrote more than eighty books in Urdu, Arabic and Persian, defending Islam by argument, never force.",
"In 1905 he wrote The Will (Al-Wasiyyat), promising that Khilafat, the 'second manifestation', would follow him.",
"He passed away on 26 May 1908. The next day, Hazrat Nooruddin(ra) was elected the first Khalifa."],
["How did God support him?","What did he promise in The Will?"],{p:"BRE 256–259",refs:[SRC.WILL]}),
L("Khilafat-e-Ahmadiyya: I and II","SYL",[
"Allah promises Khilafat to believers who do good works (Qur'an 24:56).",
"Khalifatul Masih I, Hazrat Hakim Nooruddin(ra) (1908–1914): the first to take bai'at, a great scholar of the Qur'an and a physician. He set up the treasury, schools and publications, and defended Khilafat.",
"Khalifatul Masih II, Hazrat Mirza Bashir-ud-Din Mahmud Ahmad(ra) (1914–1965): the 'Promised Son', elected at 25 and Khalifa for 52 years.",
"He sent missions abroad (the USA in 1920), began Tahrik-e-Jadid and Waqf-e-Jadid, created the auxiliary organisations, and wrote the 10-volume commentary Tafsir-e-Kabir."],
["What does the Qur'an say about Khilafat?","Who were the first and second Khalifas?"],{p:"BRE 260–269",refs:[Q("24:56"),SRC.WILL]}),
L("Khilafat-e-Ahmadiyya: III and IV","SYL",[
"Khalifatul Masih III, Hazrat Mirza Nasir Ahmad(rh) (1965–1982): educated at Oxford, had memorised the whole Qur'an by 13.",
"He launched the Nusrat Jehan Scheme, which built 17 medical centres and 15 schools in West Africa.",
"At the foundation of the Basharat Mosque in Spain he announced the motto 'Love for All, Hatred for None'.",
"Khalifatul Masih IV, Hazrat Mirza Tahir Ahmad(rh) (1982–2003): developed MTA, the Community's satellite TV. In 1993 the first International Bai'at was held by satellite; over 200,000 joined."],
["Who were the third and fourth Khalifas?","What is the Community's motto?"],{p:"BRE 271–280"}),
L("Khilafat-e-Ahmadiyya: V and Today","SYL",[
"Khalifatul Masih V, Hazrat Mirza Masroor Ahmad(aba), was elected on 22 April 2003.",
"He leads a worldwide effort promoting peace, the worship of God and service to humanity.",
"He delivers a Friday Sermon every week, broadcast live on MTA in many languages, and replies to thousands of letters.",
"Even after 86 Ahmadis were martyred in Lahore in 2010, he told the Community to respond only with prayer and peace.",
"Today the Community is in over 200 countries and has built thousands of mosques, schools and clinics."],
["What is the name of the fifth Khalifa?","What are some achievements of the Community?"],{p:"BRE 281–290"})
],quiz:[
["Who was the first Khalifa after the Holy Prophet(sa)?",["Hazrat Ali(ra)","Hazrat Abu Bakr(ra)","Hazrat Umar(ra)","Hazrat Uthman(ra)"],1],
["Who was the first Khalifa of the Promised Messiah(as)?",["Hazrat Nooruddin(ra)","Hazrat Mirza Nasir Ahmad(rh)","Hazrat Mirza Tahir Ahmad(rh)","Hazrat Mirza Masroor Ahmad(aba)"],0],
["Which Khalifa announced 'Love for All, Hatred for None'?",["The First","The Second","The Third","The Fifth"],2],
["How many articles of faith are there?",["Three","Five","Six","Ten"],2],
["Where did the Holy Prophet(sa) receive the first revelation?",["Cave of Thaur","Cave of Hira","Madinah","Ta'if"],1],
["When was the Promised Messiah(as) born?",["1835","1889","1908","1876"],0]
]},
{id:"m2",no:2,title:"Learning to Pray",short:"Salat",blurb:"Why we pray, when, how to do Wudu, and the prayer step by step.",hue:"pink",lessons:[
L("Why Salat Matters","SAL",[
"Salat (prayer) is the second pillar of Islam and is required of every adult Muslim of sound mind.",
"It cleanses the heart, keeps a person away from wrongdoing and brings them close to Allah.",
"The Holy Prophet(sa) said the five prayers wash away sins like bathing in a river five times a day.",
"The Promised Messiah(as) called prayer the key to success, and taught that its heart is heartfelt supplication."],
["Why is Salat so important?"],{p:"BRE 174–177"}),
L("Kinds of Prayer and Prayer Times","SAL",[
"Fard (compulsory) units, called rak'at: Fajr 2 · Zuhr 4 · Asr 4 · Maghrib 3 · Isha 4.",
"Sunnah prayers, the Prophet's(sa) practice: 2 before Fajr, 4 before and 2 after Zuhr, 2 after Maghrib, 2 after Isha. Witr is 3 rak'at after Isha.",
"Fajr: dawn until just before sunrise. Zuhr: after midday. Asr: late afternoon. Maghrib: just after sunset. Isha: after dusk, ideally before midnight.",
"No prayer is offered exactly at sunrise, noon or sunset."],
["What types of prayer are there?","What are the prayer times?"],{p:"BRE 178–181"}),
L("Getting Ready to Pray","SAL",[
"Before praying: make your intention, be clean in body, clothes and place, cover yourself modestly, and face the Qiblah (the Ka'bah in Makkah).",
"Women cover everything except the face, hands and feet.",
"It's best to pray in congregation at a mosque, standing in straight rows, but you can pray anywhere clean.",
"Tip: a prayer-times app or the mosque's timetable makes it easy to know each time."],
["What are the etiquettes of Salat?"],{p:"BRE 178–181"}),
L("Wudu, Adhan and Iqamah","SAL",[
"Wudu (washing before prayer), each step usually three times: hands · rinse mouth · nose · face · each arm to the elbow, right first · wipe the head and ears · each foot to the ankle, right first.",
"Wudu is broken by using the toilet, passing wind or deep sleep. If no water is available, do tayammum: pat clean earth and wipe the face and hands.",
"The Adhan is the call to prayer. Its meaning: Allah is the Greatest · I bear witness none is worthy of worship but Allah · and that Muhammad is His Messenger · come to prayer · come to success.",
"The Iqamah is a shorter call said just before the prayer starts, announcing 'the prayer is ready'."],
["What is the significance of a mosque?","How is Wudu performed?","What are the Adhan and Iqamah?"],{p:"BRE 182–187"}),
L("How to Pray, Part 1","SAL",[
"1 · Raise both hands to your ears and say Allahu Akbar (Allah is the Greatest).",
"2 · Stand with the right hand over the left on your chest. Silently praise Allah (Thana), seek refuge from Satan, and say Bismillah.",
"3 · Recite Surah Al-Fatiha, then 'Amin', then a short Surah such as Al-Ikhlas.",
"4 · Bow (Ruku'), hands on knees, back straight: 'Subhana Rabbiyal-'Azim' (Glory to my Lord, the Most Great), three times.",
"5 · Stand up saying 'Sami'allahu liman hamidah' (Allah hears those who praise Him), then 'Rabbana lakal-hamd' (Our Lord, all praise is Yours)."],
["Practise the standing and bowing positions slowly."],{p:"BRE 188–191"}),
L("How to Pray, Part 2","SAL",[
"6 · Prostrate (Sajdah): forehead, nose, hands, knees and toes on the ground. Say 'Subhana Rabbiyal-A'la' (Glory to my Lord, the Most High) three times.",
"7 · Sit briefly and ask forgiveness, then prostrate a second time. That completes one rak'at.",
"8 · After two rak'at, sit and recite the Tashahhud (testimony of faith), raising the right index finger at the testimony.",
"9 · At the end, recite Durud (blessings on the Prophet(sa)) and a short prayer.",
"10 · Turn your head right, then left: 'Assalamu 'alaikum wa rahmatullah' (peace and mercy of Allah be on you)."],
["Practise the full prayer once, slowly, from start to finish."],{p:"BRE 191–195"}),
L("After the Prayer, and Witr","SAL",[
"After Salat, sit and remember Allah: 'Subhanallah' 33 times, 'Alhamdulillah' 33 times, 'Allahu Akbar' 34 times.",
"A beautiful short prayer after Salat: 'O Allah, You are Peace, and from You comes peace.'",
"Witr is three rak'at prayed after Isha. In the third rak'at, after bowing, a special prayer called Qunut asks Allah for help, forgiveness and protection.",
"On Fridays, the congregational Jumu'ah prayer with a sermon replaces Zuhr."],
["What is said after Salat?","What is the Witr prayer?"],{p:"BRE 196–200"}),
L("The Funeral Prayer","SAL",[
"The funeral prayer (Janazah) is offered standing only, with no bowing or prostration.",
"Takbir 1: praise Allah and recite Al-Fatiha.  Takbir 2: recite Durud on the Holy Prophet(sa).",
"Takbir 3: pray for the person who has passed away.  Takbir 4: end with salam to the right and left.",
"It is a communal duty: if some Muslims offer it, the rest are excused."],
["How is the funeral prayer offered?"],{p:"BRE 200–203"}),
L("Understanding the Words, Part 1","SAL",[
"Allahu Akbar: Allah is the Greatest.",
"Thana: 'Holy are You, O Allah, and all praise is Yours; blessed is Your name, exalted Your majesty, and there is none worthy of worship besides You.'",
"Ta'awwudh: I seek refuge in Allah from Satan, the rejected.  Bismillah: In the name of Allah, the Gracious, the Merciful.",
"Knowing the meaning helps you focus. The Promised Messiah(as) taught that prayer should be offered with understanding."],
["Say each phrase and its meaning aloud."],{p:"BRE 205–210"}),
L("Understanding the Words, Part 2","SAL",[
"Tashahhud: all greetings, prayers and good things are for Allah; peace be on the Prophet and on all righteous servants; I bear witness there is none worthy of worship but Allah, and that Muhammad is His servant and Messenger.",
"Durud: O Allah, bless Muhammad and his people as You blessed Abraham and his people.",
"If you are ill, pray sitting or lying down. When travelling, the 4-rak'at prayers are shortened to 2 and prayers may be combined.",
"If you make a mistake, two extra prostrations at the end (Sajdah Sahw) make up for it."],
["Which phrase means the most to you?"],{p:"BRE 116–120"})
],quiz:[
["How many fard rak'at are in Maghrib?",["2","3","4","5"],1],
["What does 'Allahu Akbar' mean?",["Allah is One","Allah is the Greatest","All praise to Allah","In the name of Allah"],1],
["What is Tahajjud?",["The Friday prayer","The late-night voluntary prayer","The funeral prayer","The call to prayer"],1],
["In Wudu, what is washed last?",["The face","The arms","The feet","The hands"],2],
["How many takbirs are in the funeral prayer?",["Two","Three","Four","Seven"],2],
["What do you say in Sajdah?",["Subhana Rabbiyal-A'la","Rabbana lakal-hamd","Amin","Allahu Akbar only"],0]
]},
{id:"m3",no:3,title:"Reading the Qur'an",short:"Recitation",blurb:"The Arabic letters and sounds, then the 40 lessons of Yassarnal Qur'an.",hue:"mint",lessons:[
L("The Arabic Letters and Vowel Marks","YQ",[
"Arabic is read from right to left and has 28 letters. Most letters join to the next one, and their shape changes slightly depending on position.",
"Short vowels are written as small marks (Irab): Fatha, a stroke above, gives 'a'; Kasra, a stroke below, gives 'i'; Damma, a small loop above, gives 'u'.",
"Sukun, a small circle, means the letter has no vowel.",
"Tip: learn a few letters a day out loud, with a teacher or a recording, rather than all at once."],
["What are the Arabic letters?","What are Irab, the vowel marks?"],{p:"BRE 41–44"}),
L("Shaddah, Tanween and Long Vowels","YQ",[
"Shaddah, a small 'w'-shaped mark, doubles a letter: you pronounce it twice, with emphasis.",
"Tanween, doubled vowel marks, adds an 'n' sound at the end: -an, -in, -un.",
"Madd letters (alif, waw, ya) stretch a vowel into a long sound.",
"Each rule makes the recitation correct and beautiful. Practise slowly; speed comes later."],
["What is a Shaddah?"],{p:"BRE 45–59"}),
L("Qāʻidah Yassarnal-Qur'ān: the 40 lessons","YQ",[
"Yassarnal Qur'an is the Jama'at's step-by-step book for learning to read the Qur'an. It has 40 lessons.",
"A beginner can usually finish it in about six months.",
"It is not a teach-yourself book: its notes are a guide for a teacher, so learn it with someone who can listen to you read.",
"Tick each lesson below as you finish it. The syllabus says this class continues, at your own pace, until all 40 are done."],
["Who could be your recitation teacher?"],{yq:true,refs:[SRC.YQ]})
],quiz:[
["How many lessons are in Yassarnal Qur'an?",["10","28","40","114"],2],
["Which direction is Arabic read?",["Left to right","Right to left","Top to bottom","Either way"],1],
["What does a Shaddah do?",["Removes the vowel","Doubles the letter","Adds an 'n' sound","Lengthens the vowel"],1],
["What does a Sukun show?",["A long vowel","No vowel on the letter","A doubled letter","The end of a verse"],1]
]},
{id:"m4",no:4,title:"The Last Ten Surahs",short:"Memorise",blurb:"Learn Surahs 105 to 114 by heart, with their meaning.",hue:"peach",lessons:[
L("Al-Fil (105): The Elephant","PRI",["Recalls the army that marched with elephants to destroy the Ka'bah, and how God destroyed it before it could.","Lesson: God protects His House, and no power can defeat His plan.","How to memorise: listen to one verse, repeat it five times, then add the next. Recite it in your prayers."],["Memorise it and explain its meaning in one sentence."],{p:"BRE 83",quran:"105:1"}),
L("Quraish (106)","PRI",["Reminds the Quraish of God's favours: safe trade journeys in winter and summer.","So they should worship the Lord of this House, who fed them in hunger and kept them safe from fear."],["Memorise it and explain its meaning."],{p:"BRE 83",quran:"106:1"}),
L("Al-Ma'un (107): Small Kindnesses","PRI",["Warns against denying the faith, pushing away the orphan and not encouraging feeding the poor.","It also warns against praying carelessly or only to be seen, and refusing even small help to others."],["Memorise it and explain its meaning."],{p:"BRE 84",quran:"107:1"}),
L("Al-Kauthar (108): Abundance","PRI",["God has given the Prophet(sa) abundant good.","So pray and offer sacrifice. It is his enemy who will be cut off. The shortest Surah in the Qur'an."],["Memorise it and explain its meaning."],{p:"BRE 84",quran:"108:1"}),
L("Al-Kafirun (109)","PRI",["Tells the disbelievers: I do not worship what you worship, and you do not worship what I worship.","'For you your religion, and for me mine': worship cannot be mixed, and no one is forced."],["Memorise it and explain its meaning."],{p:"BRE 84",quran:"109:1"}),
L("An-Nasr (110): Help","PRI",["When God's help and victory come and people enter Islam in large numbers,","glorify your Lord with His praise and ask His forgiveness. Success should bring humility, not pride."],["Memorise it and explain its meaning."],{p:"BRE 85",quran:"110:1"}),
L("Al-Lahab (111)","PRI",["About Abu Lahab, an uncle of the Prophet(sa) who fiercely opposed him, and his wife.","His wealth and efforts against the truth could not save him. Opposing God's messenger leads to loss."],["Memorise it and explain its meaning."],{p:"BRE 85",quran:"111:1"}),
L("Al-Ikhlas (112): Pure Oneness","PRI",["Say: He is Allah, the One. Allah, who needs no one.","He has no children and was not born, and there is none like Him. It sums up the belief in One God."],["Memorise it and explain its meaning."],{p:"BRE 85",quran:"112:1"}),
L("Al-Falaq (113): Daybreak","PRI",["Seek refuge in the Lord of the daybreak from the harm in creation,","from the darkness when it spreads, from those who blow on knots (who try to break bonds), and from the envious."],["Memorise it and explain its meaning."],{p:"BRE 86",quran:"113:1"}),
L("An-Nas (114): Mankind","PRI",["Seek refuge in the Lord, King and God of mankind,","from the sneaking whisperer who puts evil thoughts into people's hearts, whether from jinn or men. The final chapter of the Qur'an."],["Memorise it and explain its meaning."],{p:"BRE 86",quran:"114:1"})
],quiz:[
["Which Surah is about the oneness of God?",["Al-Fil","Al-Ikhlas","Al-Kauthar","An-Nasr"],1],
["Which is the last chapter of the Qur'an?",["Al-Falaq","An-Nas","Al-Kauthar","Al-Ma'un"],1],
["Which Surah is the shortest in the Qur'an?",["Al-Kauthar","Al-Ikhlas","An-Nasr","Quraish"],0],
["Al-Ma'un warns against…",["Fasting too much","Pushing away the orphan","Travelling in winter","Building houses"],1]
]},
{id:"m5",no:5,title:"What Ahmadis Believe",short:"Beliefs",blurb:"The reasons behind Ahmadi beliefs, and how the Jama'at is organised.",hue:"violet",lessons:[
L("About Invitation to Ahmadiyyat","ITA",[
"The book was written in 1926 by Hazrat Mirza Bashir-ud-Din Mahmud Ahmad(ra), the second Khalifa, as a letter to Amanullah Khan, the ruler of Afghanistan.",
"It followed the stoning of Ahmadis in Afghanistan in 1924 and explains, from the Qur'an and Hadith, what Ahmadis really believe.",
"The name 'Ahmadi' simply marks members out from other Muslims. It honours the Holy Prophet's(sa) second name, Ahmad."],
["What do you know about the author and the book?","Why was the name Ahmadiyya chosen?"],{p:"ITA 3"}),
L("The Name Islam","ITA",[
"Ahmadiyyat is part of Islam, not a new religion. 'Islam' is the name God Himself gave in the Qur'an.",
"A Muslim is anyone who declares the Kalimah and accepts Islam.",
"The Holy Prophet(sa) taught that we judge only what a person says, not what is in their heart. When a companion killed a man who had just said the Kalimah, the Prophet(sa) asked, 'Did you split open his heart?'"],
["Who named our religion Islam?","Who is a Muslim?","Are Ahmadis Muslims?"],{p:"ITA 3–6"}),
L("Beliefs Ahmadis Hold","ITA",[
"Ahmadis believe in God's existence and oneness, His perfection, and His angels.",
"God speaks to His chosen servants; the Qur'an is the most perfect revelation, and its law stands for all time.",
"God sent guides to every people, and the Holy Prophet(sa) is the chief of them all.",
"God answers prayer, there will be resurrection and judgement, Hell is for reform rather than endless, and Paradise brings people ever closer to God.",
"The book points out these beliefs match those of all Muslim scholars."],
["What is our belief about God?","About angels?","Does God speak?"],{p:"ITA 6–11"}),
L("Jesus(as) Died a Natural Death","ITA",[
"Ahmadis believe Jesus(as) survived the cross and later died a natural death. This honours him; it doesn't insult him.",
"Qur'an 3:56: God told Jesus He would cause him to die and then exalt him. The death comes first.",
"Qur'an 5:118: Jesus says that after God caused him to die, God alone watched over his followers.",
"Believing he lives bodily in heaven while the Holy Prophet(sa) rests in the earth doesn't fit the Prophet's(sa) rank."],
["Is Jesus alive in heaven?","What does the Qur'an say about his death?"],{p:"ITA 11–16",refs:[Q("3:56"),Q("5:118"),SRC.JII]}),
L("Jesus(as): What the Companions Believed","ITA",[
"When the Holy Prophet(sa) died, Hazrat Abu Bakr(ra) recited Qur'an 3:145: all messengers before him had passed away. Hazrat Umar(ra) and the companions accepted it, showing none believed Jesus was still alive.",
"A Hadith says Jesus lived to 120 years.",
"When Hazrat Ali(ra) passed away, Imam Hasan(ra) said he died on the same night Jesus' spirit was raised up, which only makes sense if Jesus died.",
"Imam Malik also held that Jesus had died."],
["What did the Companions believe about Jesus(as)?","What did Imam Hasan(ra) say?"],{p:"ITA 17–24",refs:[Q("3:145")]}),
L("The Second Coming: a Follower of the Prophet(sa)","ITA",[
"Since Jesus(as) has died, the promised 'second coming' means someone in his spirit, from among the Holy Prophet's(sa) followers.",
"Hazrat Mirza Ghulam Ahmad(as) holds this title: the Promised Messiah.",
"Bringing back an old Israelite prophet would suggest the Holy Prophet's(sa) own spiritual power had run out, which Ahmadis reject."],
["Will the first Messiah come again physically?","Will the second Messiah be an Israelite?"],{p:"ITA 24–30"}),
L("Messiah and Mahdi: One Person","ITA",[
"Hadith: 'There is no Mahdi except Isa (Jesus).' Another: 'How will you be when the son of Mary descends among you, and he is your Imam from among you?'",
"So the Messiah and the Mahdi are the same person.",
"'Nuzul' (descent) means coming with great significance, not falling from the sky. The Qur'an speaks of iron and cattle being 'sent down', and of the Prophet(sa) himself being 'sent down' (65:11)."],
["Are the Messiah and the Mahdi two different people?","What does Nuzul mean?"],{p:"ITA 30–35"}),
L("Why 'Son of Mary'?","ITA",[
"'Son of Mary' is a spiritual title, not a claim that Jesus himself returns.",
"The Qur'an holds up Mary as an example for believers: a believer can reach a spiritual state like hers.",
"People use names this way all the time: calling a generous person 'a Hatim' after a famous generous Arab."],
["Why is the second Messiah called Isa ibn Maryam?"],{p:"ITA 35–41"}),
L("Seal of the Prophets","ITA",[
"Qur'an 33:41 calls the Holy Prophet(sa) 'Khatam an-Nabiyyin', the Seal of the Prophets.",
"A seal confirms and validates. It means his rank is above all prophets and every blessing passes through him.",
"Prophethood that brings a new law, or that is independent of him, is closed. A prophet who is his follower and servant is possible.",
"He said 'I am the last prophet' and also 'my mosque is the last mosque', yet new mosques are built. Hazrat Aishah(ra) advised: say he is the Seal of the Prophets, but don't say there is no prophet after him."],
["What does Khatam an-Nabiyyin mean?","Does 'I am the last prophet' close every door?"],{p:"ITA 41–47",refs:[Q("33:41")]}),
L("The Ranks of Obedience, and Jihad","ITA",[
"Qur'an 4:70: whoever obeys Allah and the Messenger will be among those He has blessed: prophets, the truthful, martyrs and the righteous.",
"Muslims pray for 'the path of those You have blessed' in every Al-Fatiha, so these ranks remain open.",
"Jihad: there is no compulsion in religion (2:257). Fighting is allowed only in defence against those who persecute people for their faith, and Islam protects all places of worship (22:41)."],
["Which ranks can obedience bring?","What does Jihad mean?"],{p:"ITA 47–57",refs:[Q("4:70")]}),
L("The Claim and the Need of the Hour","ITA",[
"His claim: God raised him as the Messiah and Mahdi foretold by the Holy Prophet(sa), to show the Prophet's(sa) glory and make Islam victorious through argument.",
"God meets our physical needs, so He meets our spiritual needs too.",
"God promised to guard the Qur'an (15:10), and the Holy Prophet(sa) said a reformer would come at the head of every century.",
"Muslims had fallen into deep spiritual decline. He was the one who claimed this role at that time."],
["Why did Allah send the Promised Messiah(as)?","How can we test his truthfulness?"],{p:"ITA 58–66"}),
L("How the Jama'at Began","SYL",[
"In December 1888 the Promised Messiah(as) announced that God had told him to found a community; on 12 January 1889 he published the ten conditions.",
"The first bai'at took place on 23 March 1889, which is when the Ahmadiyya Movement began.",
"The name Ahmadiyya honours the Holy Prophet's(sa) name Ahmad.",
"Today the Community is in over 200 countries. Its work is done mostly by volunteers.",
"To join, a person agrees to the ten conditions and signs a pledge of allegiance to the Khalifa of the time."],
["When and by whom was the Jama'at founded?","What does joining involve?"],{p:"Appendix 1, pp. 17–18"}),
L("Khilafat: the Second Manifestation","SYL",[
"'Khalifa' means one who comes after, carrying on the prophet's mission.",
"In The Will (1905) the Promised Messiah(as) wrote that his coming was the first manifestation of God's power, and that after him would come a second, lasting one: Khilafat.",
"Ahmadis believe Allah guides the election of each Khalifa, and members renew their bai'at with every new Khalifa.",
"The Khalifa is the spiritual head of every Ahmadi, prays for each of them, and Ahmadis write to him for prayers and guidance."],
["What are the two manifestations of God's power?","What is the status of the Khalifa?"],{p:"Appendix 1, pp. 19–23",refs:[SRC.WILL,Q("24:56")]}),
L("How the Jama'at Works","SYL",[
"The Khalifa leads. Each country has an Ameer and a national team; each local branch elects a President.",
"Members belong to an auxiliary: Lajna Ima'illah for women 15 and over (Nasirat for girls 7–15), Khuddam for men 15–40 (Atfal for boys 7–15), and Ansarullah for men over 40.",
"Everything is funded by members' donations (chanda). For an earning member, Chanda Aam is 1/16 of income; others include Jalsa Salana, Tahrik-e-Jadid, Waqf-e-Jadid and Wasiyyat.",
"Anyone in financial hardship may pay less, or nothing, with the Khalifa's permission. The Qur'an says you won't reach righteousness until you spend from what you love (3:93)."],
["How is the Jama'at structured?","Which auxiliary would you join?","Why does giving matter?"],{p:"Appendix 1, pp. 24–27",refs:[Q("3:93")]})
],quiz:[
["On what date did the first bai'at take place?",["12 January 1889","23 March 1889","26 May 1908","22 April 2003"],1],
["Why is the Community called 'Ahmadiyya'?",["After Qadian","After the Prophet's(sa) name Ahmad","After the first Khalifa","After a city"],1],
["Which auxiliary is for women aged 15 and over?",["Ansarullah","Khuddam","Lajna Ima'illah","Nasirat"],2],
["Ahmadis believe the Messiah and Mahdi are…",["Two people","One person","Angels","Still to be born"],1],
["'Khatam an-Nabiyyin' (33:41) means…",["Seal of the Prophets","First of the Prophets","King of Arabia","Last of the Khalifas"],0]
]},
{id:"m6",no:6,title:"The Ten Conditions of Bai'at",short:"Bai'at",blurb:"What you promise when you join, one condition at a time.",hue:"pink",lessons:[
L("What is Bai'at?","COB",[
"Bai'at means handing your life over to Allah. The Promised Messiah(as) called it 'selling yourself' to God.",
"The Holy Prophet(sa) took bai'at from his companions too, at 'Aqabah: not to associate partners with God, not to steal, commit adultery or slander, and to obey him in good.",
"In 1888 God commanded the Promised Messiah(as) to take bai'at. He asked people first to pray for guidance (Istikharah).",
"The first bai'at was on 23 March 1889 at the house of Sufi Ahmad Jan in Ludhiana. Hazrat Nooruddin(ra) pledged first."],
["What is bai'at?","Which condition strikes you most, and why?","How did bai'at begin?"],{c:0}),
L("Condition 1: No Shirk","COB",[
"Shirk means associating anything with God. The Qur'an says God does not forgive it, though He forgives other sins (4:49).",
"It isn't only idol worship. Relying totally on a boss, your children, your own cleverness or charms, or praying to the dead, are hidden forms of it.",
"The Holy Prophet(sa) feared his followers would fall into hidden shirk, like doing good just to show off.",
"True Tauhid (oneness) means your love, worship, hope and fear are directed to God alone."],
["What is Shirk?","What does Allah not forgive?"],{c:1}),
L("Condition 2: Truthfulness and Purity","COB",[
"Falsehood is called the greatest evil. A man once promised the Prophet(sa) never to lie; that one promise led him to give up all his other sins.",
"Don't even go near adultery (17:33). Avoid what leads to it, including unsuitable films.",
"Men and women are both told to lower their gaze (24:31)."],
["Why is falsehood the greatest of evils?","Why guard the eyes?"],{c:2}),
L("Condition 2: Cruelty and Dishonesty","COB",[
"Cruelty includes taking what belongs to others. The Prophet(sa) warned that someone with many prayers could still be bankrupt on Judgement Day because of how they treated people.",
"Dishonesty in any form is forbidden, and so is defending the dishonest (4:108).",
"Wickedness and immorality are made hateful to true believers (49:8)."],
["What did the Prophet(sa) say about cruelty?","What does Allah say about dishonesty?"],{c:2}),
L("Condition 2: Mischief and Desires","COB",[
"Don't spread mischief on earth (28:78). The Promised Messiah(as) taught: bear abuse patiently and forgive rather than quarrel.",
"Be loyal to the country and government you live under.",
"Passion is like a flood that only God's mercy can hold back. Those not yet able to marry should practise self-control, for example by fasting."],
["What does the Promised Messiah(as) advise about mischief and passions?"],{c:2}),
L("Condition 3: Prayer and Tahajjud","COB",[
"Pray the five daily prayers, in congregation where possible. Travel and illness allow shortening or combining, never skipping.",
"Prayer is the first thing we'll be asked about on Judgement Day.",
"Tahajjud, the late-night prayer, brings you close to God, guards against sin and heals faults. In the last third of the night God invites His servants to ask.",
"The Promised Messiah(as) asked his followers to pray at least two rak'at of Tahajjud.",
"Durud: whoever sends blessings on the Prophet(sa) receives ten blessings from God."],
["Name two benefits of Tahajjud.","Why recite Durud regularly?"],{c:3}),
L("Condition 3: Istighfar and Gratitude","COB",[
"Istighfar means asking God's forgiveness. The Qur'an promises it brings rain, wealth and children (71:11–13), and a hadith says it opens a way out of every difficulty.",
"The Promised Messiah(as) described two kinds: one that protects you from sins before they happen, and one that brings you back after a sin.",
"Gratitude: if you can't thank God for small favours, you won't thank Him for big ones. Begin important things with praise of Allah."],
["What is Istighfar, and what are its two types?","How does Allah treat the grateful?"],{c:3}),
L("Condition 4: Do No Harm","COB",[
"Never harm anyone, by tongue, hand or any other way, even when you're angry.",
"The Qur'an praises those who hold back anger and forgive (3:135). A man asked the Prophet(sa) for advice; he said, twice, 'Don't get angry.'",
"Abu Dharr(ra), when angry, would sit down and then lie down, as the Prophet(sa) advised.",
"Avoid envy, malice and breaking off relations: 'be brothers'."],
["What advice did the Prophet(sa) give about anger?","How can you calm anger?"],{c:4}),
L("Condition 5: Faithful in Good Times and Bad","COB",[
"Stay faithful to God whether life is easy or hard.",
"A believer finds good in everything: gratitude in ease, patience in hardship. Every small hardship removes some sins.",
"The Qur'an promises 'the soul at peace' entry into Allah's Garden (89:28–31)."],
["What glad tidings does God give the steadfast?","What does the Prophet(sa) say about Muslims who suffer?"],{c:5}),
L("Condition 5: Real Patience","COB",[
"A grieving woman, not recognising the Prophet(sa), brushed off his advice to be patient. He taught that real patience is at the first shock of grief.",
"Remember Allah in good times and He will be with you in hard times.",
"Two early Ahmadi martyrs, Sahibzada Abdul Latif and Abdur Rahman Khan, refused to give up their bai'at even to save their lives."],
["What did the Prophet(sa) tell the grieving woman?","Who showed perfect steadfastness?"],{c:5}),
L("Condition 6: Leave Harmful Customs","COB",[
"Customs that go against Islam should be left, like showing off at weddings, extravagant feasts, or displaying dowry, which push poorer families into debt.",
"Only the bride's mehr (marriage gift) needs to be publicly announced.",
"Every innovation added to religion is rejected. Reviving a true Sunnah brings reward."],
["Name some harmful wedding customs.","How can you avoid innovations?"],{c:6}),
L("Condition 6: The Qur'an as Your Guide","COB",[
"The Qur'an is made easy to remember (54:18).",
"A believer who reads the Qur'an and acts on it is like a citron: sweet to taste and fragrant.",
"The Promised Messiah(as) taught that ignoring even one of its commands closes a door of salvation.",
"Practical step from Hazrat Khalifatul Masih V(aba): read a few verses daily, then their translation."],
["How can you bring the Qur'an into daily life?"],{c:6}),
L("Condition 7: Give Up Pride","COB",[
"Pride was Satan's downfall: he refused to bow to Adam.",
"Three roots of sin: pride (Satan's refusal), greed (Adam eating from the tree) and envy.",
"Pride shows up at home too, for example harshness toward a spouse or children.",
"Don't walk on the earth, full of pride. Remove pride and fill the space with humility."],
["Name the three roots of every sin.","Give examples of pride at home."],{c:7}),
L("Condition 7: Pride After Shirk","COB",[
"The Promised Messiah(as) said that after shirk, pride is the worst evil.",
"Someone with pride the size of a mustard seed won't enter Paradise. Looking good isn't pride; rejecting truth and looking down on people is.",
"Honour and greatness belong to God alone."],
["After Shirk, what is the greatest evil?","What was the first sin?"],{c:7}),
L("Condition 7: Humility","COB",[
"Allah raises whoever is humble and lowers whoever is proud. Forgiving never lowers your honour.",
"The servants of the Gracious walk humbly, and answer the ignorant with 'peace'.",
"The Prophet(sa) prayed to live and die among the humble.",
"Everyday pride to avoid: mocking others, refusing to listen, looking down on the poor."],
["How does Allah raise a person's status?","What did the Promised Messiah(as) say about anger?"],{c:7}),
L("Condition 8: Faith Above All","COB",[
"Faith comes before life, wealth, honour and family.",
"When alcohol was forbidden, the companions broke their wine jars immediately (Bukhari).",
"Whoever fully submits to Allah has no fear or grief (2:113).",
"Certainty of faith keeps you from sin, like knowing a snake is there keeps you away from it."],
["How do we put faith first?","Why do perfect understanding and love matter?"],{c:8}),
L("Condition 9: Serving Humanity","COB",[
"Be good to parents, relatives, orphans, the needy, neighbours and travellers (4:37).",
"The righteous feed the poor, the orphan and the prisoner for love of Allah, wanting no thanks (76:9).",
"Help should be sincere: never give something worn out without cleaning and mending it."],
["Whom does Allah tell us to treat kindly?","What should our intention be?"],{c:9}),
L("Condition 9: All Creation is God's Family","COB",[
"Visiting the sick, feeding the hungry and covering others' faults bring Allah's mercy.",
"The Prophet(sa) said all creatures are God's family.",
"There are two kinds of rights: those owed to God and those owed to people. Both are part of the pledge."],
["What are the two categories of rights?","How can you ease someone's worries this week?"],{c:9}),
L("Condition 9: Compassion in Action","COB",[
"The Promised Messiah(as) stopped what he was doing to help people in need, and read an elderly woman's letter himself when someone was short with her.",
"Ahmadis serve through schools and hospitals in Africa (the Nusrat Jehan Scheme) and through disaster relief.",
"Hazrat Khalifatul Masih V(aba) asks every doctor, teacher and lawyer to use their skills for the needy."],
["What habits block compassion?","Name a few ways of pleasing Allah."],{c:9}),
L("Condition 10: The Bond of Obedience","COB",[
"This bond with the Promised Messiah(as), carried on through his Khalifas, should be stronger than any family tie.",
"Obedience is in what is good (Ma'ruf). A prophet or Khalifa only commands what is good; there is no obedience in disobeying God.",
"Obedience should be practical, not just words (24:54)."],
["What does 'obedience in everything good' mean?","What are the benefits of obeying the Khalifa?"],{c:10}),
L("Condition 10: Examples of Obedience","COB",[
"When Hazrat Umar(ra) replaced the great general Khalid bin Walid(ra) with Abu Ubaidah(ra), Khalid simply carried on serving under him.",
"Companions of the Promised Messiah(as) gave up habits like smoking as soon as they knew he disliked them.",
"The Promised Messiah(as) compared the Jama'at to a ship in a storm: those aboard are kept safe."],
["What did Khalid bin Walid(ra) show?","Why give salaam to the Promised Messiah(as)?"],{c:10}),
L("Condition 10: Who Enters the Jama'at","COB",[
"Joining means leaving gossip, insults and fights, speaking the truth even in court, and treating everyone kindly.",
"Obey those in authority in ease and hardship. Take any concern about a local leader to the Khalifa rather than complaining.",
"Hazrat Khalifatul Masih V(aba) prays that every Ahmadi fulfils each condition as a duty."],
["How should we treat leaders?","How do people behave once they join?"],{c:10})
],quiz:[
["Which condition is about Shirk?",["1","4","7","10"],0],
["Which condition asks you to give up pride?",["2","5","7","9"],2],
["Serving God's creation is the focus of condition…",["3","6","8","9"],3],
["Condition 10 asks for obedience in…",["Everything good","Worldly matters only","Money only","Nothing"],0],
["What are the three roots of sin?",["Pride, greed, envy","Anger, sleep, hunger","Lying, theft, laziness","None of these"],0]
]},
{id:"m7",no:7,title:"Why Ahmadiyyat is True",short:"Proofs",blurb:"The signs, prophecies and arguments from Invitation to Ahmadiyyat.",hue:"mint",lessons:[
L("Argument 1: The Need of the Hour","ITA",[
"God provides for every physical need, so He also provides for the soul's needs.",
"The Qur'an says God doesn't punish a people without first sending a warner.",
"Muslims had fallen into deep decline, so a reformer was needed, and he alone made this claim at that time."],
["Why did Allah send the Promised Messiah(as)?"],{p:"ITA 58–66"}),
L("God Protects the Qur'an","ITA",[
"God promised to guard the Qur'an (15:10), in its words and in its meaning.",
"Its words were protected through memorisation and the development of Arabic grammar.",
"Its meaning is protected by reformers: the Prophet(sa) said one would come at the head of every century."],
["What did Allah say about protecting the Qur'an?","What did the Prophet(sa) say about reformers?"],{p:"ITA 67–70",refs:[Q("15:10")]}),
L("The State of Muslims","ITA",[
"Prayers were neglected and mosques empty; Zakat was paid unwillingly.",
"The Qur'an was kept in beautiful covers but rarely read or understood.",
"The book argues this matches what the Holy Prophet(sa) foretold about the Latter Days."],
["What condition were Muslims in?","How was the Qur'an treated?"],{p:"ITA 70–77"}),
L("Argument 2: The Prophet's(sa) Testimony","ITA",[
"Belief in a returning Messiah existed long before Islam.",
"The Prophet(sa) linked Islam's triumph to the Messiah's time and said nothing could defeat an ummah with himself at one end and the Messiah at the other.",

function save(){
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  if(!cloud)return;
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{try{await cloud.set({...S,updatedAt:Date.now()});setSaved("Synced to your account. It works on your phone and computer.",true);}catch(e){setSaved("Couldn't reach your account just now. Progress is kept on this device.",false);}},700);

let syncMsg="Saved on this device only.",synced=false;

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function bump(){const t=ymd(new Date());if(S.streak.last===t)return;const y=new Date();y.setDate(y.getDate()-1);S.streak={last:t,count:S.streak.last===ymd(y)?S.streak.count+1:1};}

function confetti(n=46){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#7C5CE6","#E0628F","#26A37D","#E5874A","#E3A72A","#AB90FF"];
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="confetti";s.style.left=Math.random()*100+"vw";s.style.background=cols[i%cols.length];
    s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.setProperty("--rot",(Math.random()*720-360)+"deg");s.style.animationDelay=Math.random()*.3+"s";
    if(i%3===0)s.style.borderRadius="50%";document.body.appendChild(s);setTimeout(()=>s.remove(),2200);}
}

/* ================= QUIZ ENGINE ================= */
function quizInto(el,qs,title,onEnd){
  let i=0,right=0;
  function draw(){
    if(i>=qs.length){const sc=right/qs.length;el.innerHTML='<span class="label">'+esc(title)+'</span><div class="bigscore">'+right+' / '+qs.length+'</div><p class="muted">'+(sc>=.8?"Excellent! You've got this.":sc>=.5?"Good effort. Review the lessons and try again.":"Have another look at the lessons, then try again.")+'</p><div class="row"><button class="btn ghost" id="qa">Try again</button></div>';onEnd&&onEnd(sc);el.querySelector("#qa").onclick=()=>{i=0;right=0;draw();};return;}
    const q=qs[i];
    el.innerHTML='<div class="row" style="justify-content:space-between"><span class="label">'+esc(title)+'</span><span class="label">'+(i+1)+' / '+qs.length+'</span></div>'+bar(Math.round(i/qs.length*100),"thin")+'<h3 style="font-size:1.3rem">'+hon(q.q)+'</h3><div class="opts">'+q.o.map((o,j)=>'<button class="opt" data-j="'+j+'">'+hon(o)+'</button>').join("")+'</div><div id="qnext"></div>';
    animateBars();
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; el.querySelectorAll(".opt").forEach(o=>o.disabled=true);
      if(j===q.a){right++;b.classList.add("right");}else{b.classList.add("wrong");el.querySelector('.opt[data-j="'+q.a+'"]').classList.add("right");}
      el.querySelector("#qnext").innerHTML='<button class="btn" style="margin-top:6px">'+(i+1<qs.length?"Next question →":"See my score")+'</button>';
      el.querySelector("#qnext button").onclick=()=>{i++;draw();};
    });
  }
  draw();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pQuiz(){
  const started=MODS.filter(m=>mStat(m).d>0);const pool=(started.length?started:MODS.slice(0,1)).flatMap(m=>m.quiz.map(q=>({q:q[0],o:q[1],a:q[2]})));
  const extra=TEN.map((t,i)=>({q:"Which condition says: “"+t.split(".")[0]+".”",o:null,a:i})).map(z=>{const opts=shuffle([z.a,...shuffle([...Array(10).keys()].filter(k=>k!==z.a)).slice(0,3)]);return {q:z.q,o:opts.map(k=>"Condition "+(k+1)),a:opts.indexOf(z.a)};});
  const qs=shuffle(pool.concat(S.done["m6c1"]?extra:[])).slice(0,10);
  quizInto($("#pbox"),qs,"Quick quiz",sc=>{const r=Math.round(sc*qs.length);if(r>S.best){S.best=r;save();}if(sc>=.8)confetti();bump();save();});
}
function pCards(){
  let deck=shuffle(CARDS),i=0;
  const el=$("#pbox");

    el.innerHTML='<div class="row" style="justify-content:space-between"><span class="label">Tap the card to flip</span><span class="label">'+(i+1)+' / '+deck.length+'</span></div><div class="flip" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="flip-in"><div class="face front"><b>'+hon(c[0])+'</b></div><div class="face back">'+hon(c[1])+'</div></div></div><div class="row" style="justify-content:space-between"><button class="btn ghost" id="fp">‹ Back</button><button class="btn" id="fn">Next ›</button></div>';
    const f=el.querySelector("#fc");const flip=()=>f.classList.toggle("on");f.onclick=flip;f.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};

    el.querySelector("#fn").onclick=()=>{i=(i+1)%deck.length;if(i===0){deck=shuffle(CARDS);toast("Deck done! Shuffled for another round.");bump();save();}draw();};

function route(){
  document.querySelectorAll(".celebrate").forEach(d=>d.remove());
  const h=location.hash.slice(1);
  if(h==="mentor")return mentorView();
  if(!TOKEN)return authView();
