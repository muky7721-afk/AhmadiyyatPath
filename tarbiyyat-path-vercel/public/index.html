/* ================= ACCOUNT & SYNC ================= */
function mergeIn(d){
  if(!d)return;const m=Object.assign(clone(DEF),S);
  ["done","notes","yq","quiz","ten"].forEach(k=>{m[k]=Object.assign({},d[k]||{},S[k]||{});});
  Object.keys(d.quiz||{}).forEach(k=>m.quiz[k]=Math.max(d.quiz[k]||0,(S.quiz||{})[k]||0));
  Object.keys(d.notes||{}).forEach(k=>{if(!S.notes[k])m.notes[k]=d.notes[k];});
  m.best=Math.max(S.best||0,d.best||0);
  if(d.streak&&(d.streak.last>S.streak.last||(d.streak.last===S.streak.last&&d.streak.count>S.streak.count)))m.streak=d.streak;
  S=m;try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
}
const hasAny=o=>o&&["done","yq","ten","notes"].some(k=>Object.keys(o[k]||{}).length);
async function api(path,opt){
  opt=opt||{};const h={"Content-Type":"application/json"};if(TOKEN)h.Authorization="Bearer "+TOKEN;
  const r=await fetch(path,{method:opt.method||"GET",headers:Object.assign(h,opt.headers||{}),body:opt.body?JSON.stringify(opt.body):undefined,cache:"no-store"});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j.error||"Something went wrong.");e.status=r.status;throw e;}
  return j;
}
const remote={get:()=>api("/api/progress"),set:d=>api("/api/progress",{method:"POST",body:d})};
function useAccount(){LS="tp-progress:"+NAME.toLowerCase();let c=null;try{c=localStorage.getItem(LS);}catch(e){}S=Object.assign(clone(DEF),c?JSON.parse(c):{});}
async function pull(){
  if(!TOKEN)return;
  try{const r=await remote.get();cloud=remote;const before=JSON.stringify(S);if(r.progress)mergeIn(r.progress);
    if(r.name&&r.name!==NAME){NAME=r.name;try{localStorage.setItem("tp-name",NAME);}catch(e){}}
    setSaved("Saved to your account. Sign in on any device to continue.",true);
    if(!r.progress||JSON.stringify(S)!==before){save();if(r.progress&&!/^#?m\d+c\d+$/.test(location.hash))route();}
  }catch(e){
    if(e.status===401){toast("Please sign in again.");localSignOut();return;}
    setSaved(e.status===503?"Sync isn't set up on the server yet. Progress is kept on this device.":"Offline right now. Progress is kept on this device and will sync later.",false);
  }
}
function localSignOut(){TOKEN=null;NAME="";cloud=null;try{localStorage.removeItem("tp-token");localStorage.removeItem("tp-name");}catch(e){}LS="tarbiyyat-path-v2";S=clone(DEF);go("");}

      toast(mode==="signup"?"Welcome, "+NAME.split(" ")[0]+"!":"Welcome back, "+NAME.split(" ")[0]+"!");if(mode==="signup")confetti(40);
      go("");await pull();
    }catch(err){$("#au-err").textContent=err.status===503?"The site isn't connected to its database yet. Please try again later.":err.message;go_.disabled=false;go_.textContent=mode==="signup"?"Create my account":"Sign in";}
  };
  window.scrollTo({top:0});
}

/* ================= MENTOR ================= */
function mentorView(){
  let key="";try{key=sessionStorage.getItem("tp-mkey")||"";}catch(e){}
  V().innerHTML='<div class="row" style="padding-top:22px"><button class="link" id="back">‹ Home</button></div><header class="stack" style="gap:6px"><h1 style="font-size:2.4rem">Mentor view</h1><p class="muted">See every learner\'s progress and reset forgotten passwords.</p></header><section class="card stack" id="mbox"></section>';
  $("#back").onclick=()=>go("");
  const box=$("#mbox");
  const ask=msg=>{box.innerHTML='<form id="mk" class="stack" style="gap:12px"><label class="stack" style="gap:6px"><span class="label">Mentor key</span><input id="mkey" type="password" autocomplete="off" style="font:inherit;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card2);color:var(--ink)"></label><p style="color:var(--pink);font-weight:700;margin:0">'+esc(msg||"")+'</p><button class="btn" type="submit">Open</button></form>';
    $("#mk").onsubmit=e=>{e.preventDefault();key=$("#mkey").value;try{sessionStorage.setItem("tp-mkey",key);}catch(e){}load();};};
  const load=async()=>{
    box.innerHTML='<p class="muted">Loading…</p>';
    try{const r=await api("/api/mentor",{headers:{"x-mentor-key":key}});
      const rows=r.learners.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      box.innerHTML='<div class="tbl"><table><thead><tr><th>Learner</th><th>Progress</th><th>Now on</th><th>Checkpoints</th><th>Conditions</th><th>Last active</th></tr></thead><tbody id="mrows"></tbody></table></div>'
       +'<form id="rs" class="stack" style="gap:10px;border-top:1px solid var(--line);padding-top:16px"><span class="label">Reset a password</span><div class="row"><input id="rs-n" placeholder="Learner name" style="flex:1;min-width:140px;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--ink)"><input id="rs-p" placeholder="New password" style="flex:1;min-width:140px;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--ink)"><button class="btn ghost" type="submit">Reset</button></div><p class="muted" style="font-size:.86rem;margin:0">Their progress is kept. They\'ll be signed out and can sign in with the new password.</p></form>';
      const tb=$("#mrows");
      if(!rows.length)tb.innerHTML='<tr><td colspan="6" class="muted">No learners yet.</td></tr>';
      rows.forEach(l=>{const done=new Set(l.done);const cur=ALL.find(x=>!done.has(x.id));const tr=document.createElement("tr");
        [l.display,Math.round(done.size/TOTAL*100)+"% ("+done.size+"/"+TOTAL+")",cur?"M"+cur.m.no+" · "+cur.t:"Finished",Object.values(l.quiz).filter(v=>v>=.8).length+"/8",l.ten+"/10",l.updatedAt?new Date(l.updatedAt).toLocaleString():"—"].forEach(t=>{const td=document.createElement("td");td.textContent=t;tr.appendChild(td);});tb.appendChild(tr);});
      $("#rs").onsubmit=async e=>{e.preventDefault();try{await api("/api/mentor",{method:"POST",headers:{"x-mentor-key":key},body:{name:$("#rs-n").value,password:$("#rs-p").value}});toast("Password reset.");$("#rs-p").value="";}catch(err){toast(err.message);}};
    }catch(err){ask(err.message);}
  };
  key?load():ask();
  window.scrollTo({top:0});
}

if(TOKEN)useAccount();
route();
pull();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull();});
</script>
</body>
</html>
